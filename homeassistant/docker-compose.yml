# The hub: Home Assistant, Mosquitto (MQTT) and Frigate (Lorex cameras).
# For Docker on Linux. On Home Assistant OS use the add-ons instead (SETUP.md).
#
#   cp .env.example .env    # fill it in
#   docker compose up -d
#
# Home Assistant  http://<hub>:8123
# Frigate         https://<hub>:8971   (first login prints the admin password: docker logs frigate)

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    # Host networking: Lutron, Yale, Cast and discovery all need the LAN directly.
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro   # Bluetooth, for Yale Access Bluetooth
    # Z-Wave Yale module: pass the USB stick through and run Z-Wave JS UI (SETUP.md).
    # devices:
    #   - /dev/serial/by-id/usb-XXXX:/dev/zwave

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # Home Assistant, Frigate and the TV's Frigate Glance add-on
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data:/mosquitto/data

  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "512mb"   # roughly 64 MB per camera at 1080p detect resolution
    privileged: false
    environment:
      TZ: ${TZ}
      FRIGATE_NVR_HOST: ${LOREX_NVR_HOST}
      FRIGATE_NVR_USER: ${LOREX_NVR_USER}
      FRIGATE_NVR_PASSWORD: ${LOREX_NVR_PASSWORD}
      FRIGATE_MQTT_USER: ${MQTT_FRIGATE_USER}
      FRIGATE_MQTT_PASSWORD: ${MQTT_FRIGATE_PASSWORD}
    # Intel iGPU (N100 mini PC): hardware decoding and OpenVINO detection.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./frigate/config.yml:/config/config.yml
      - ./frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"            # Frigate UI and API, with login
      - "127.0.0.1:5000:5000"  # unauthenticated API: this machine only (Home Assistant's Frigate integration)
      - "8554:8554"            # go2rtc RTSP restream: Frigate Glance live video on the TV
      - "8555:8555/tcp"        # WebRTC
      - "8555:8555/udp"
    depends_on:
      - mosquitto
